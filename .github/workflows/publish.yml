name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Validate Cargo versions match tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          ENGINE_VERSION=$(awk -F'"' '/^version =/ { print $2; exit }' crates/openusage-plugin-engine/Cargo.toml)
          WAYBAR_VERSION=$(awk -F'"' '/^version =/ { print $2; exit }' crates/openusage-waybar/Cargo.toml)
          if [[ "$ENGINE_VERSION" != "$TAG_VERSION" ]]; then
            echo "openusage-plugin-engine version ($ENGINE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$WAYBAR_VERSION" != "$TAG_VERSION" ]]; then
            echo "openusage-waybar version ($WAYBAR_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release -p openusage-waybar

      - name: Package release artifact
        run: |
          mkdir -p dist
          BIN=target/release/openusage-waybar
          ARCHIVE="openusage-waybar-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "dist/$ARCHIVE" openusage-waybar
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Bundle plugins
        run: |
          tar -czf "dist/openusage-plugins-${RELEASE_TAG}.tar.gz" plugins
          (cd dist && sha256sum "openusage-plugins-${RELEASE_TAG}.tar.gz" > "openusage-plugins-${RELEASE_TAG}.tar.gz.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/*
