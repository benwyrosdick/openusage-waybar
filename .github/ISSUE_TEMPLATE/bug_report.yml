name: Bug Report
description: Report a bug in openusage-waybar
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `openusage-waybar <plugin-id>`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openusage-waybar version
      description: Output of `openusage-waybar --help` first line, or your install method/commit.
      placeholder: "e.g. 0.6.9 / cargo install --git ..."
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution & version
      placeholder: "e.g. Arch Linux 2026-04-01, Fedora 41"
    validations:
      required: true
  - type: input
    id: waybar
    attributes:
      label: Waybar version
      placeholder: "e.g. 0.10.4"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `RUST_LOG=debug openusage-waybar <plugin-id> 2> openusage.log` and attach the file or paste the relevant output.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful.
